name: Sandglass
options:
  bundleIdPrefix: com.example.sandglass   # change to your own reverse-domain id
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""   # set in Xcode: Signing & Capabilities > Team
targets:
  Sandglass:
    type: application
    platform: iOS
    sources: [Sandglass, Shared]
    info:
      path: Sandglass/Info.plist
      properties:
        CFBundleDisplayName: Sandglass
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSSupportsLiveActivities: true
        SandglassAppGroup: group.com.example.sandglass
    entitlements:
      path: Sandglass/Sandglass.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.sandglass]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sandglass
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SandglassWidgets
  # Lock Screen Live Activity, Dynamic Island, and Home Screen / Lock Screen widgets.
  SandglassWidgets:
    type: app-extension
    platform: iOS
    sources: [SandglassWidget, Shared]
    info:
      path: SandglassWidget/Info.plist
      properties:
        CFBundleDisplayName: Sandglass
        SandglassAppGroup: group.com.example.sandglass
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SandglassWidget/SandglassWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.sandglass]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sandglass.widgets
schemes:
  # The iPhone app with its widgets, picked at the top of Xcode before pressing Run.
  Sandglass:
    build:
      targets:
        Sandglass: all
    run:
      config: Debug
    archive:
      config: Release
