# Builds the iPhone and watch apps on a Mac, then launches the iPhone app in the Simulator
# and saves a screenshot, so problems show up before installing on a real device.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build the iPhone app
        run: |
          set -o pipefail
          # Signed "to run locally" so the Simulator will open it.
          xcodebuild -project Sandglass.xcodeproj -scheme Sandglass \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build | tee build-ios.log | grep -E "error:|warning:|BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Build the watch app
        run: |
          set -o pipefail
          xcodebuild -project Sandglass.xcodeproj -scheme SandglassWatch \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tee build-watch.log | grep -E "error:|warning:|BUILD" || true
          test "${PIPESTATUS[0]}" -eq 0

      - name: Launch the iPhone app in the Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -maxdepth 2 -name Sandglass.app -path "*iphonesimulator*" | head -1)
          plutil -p "$APP/Info.plist"
          ls -R "$APP" | head -60
          codesign -dvv "$APP" 2>&1 | head -12 || true
          xcrun simctl install "$UDID" "$APP"
          sleep 20
          echo "Control: launching Settings"
          xcrun simctl launch "$UDID" com.apple.Preferences || true
          sleep 5
          # Launch in the background so a hang can be caught and sampled.
          xcrun simctl launch --stdout="$PWD/app-stdout.log" --stderr="$PWD/app-stderr.log" "$UDID" com.example.sandglass > launch.log 2>&1 &
          sleep 25
          PID=$(pgrep -f "Sandglass.app/Sandglass" | head -1 || true)
          echo "App process: ${PID:-none}"
          if [ -n "$PID" ]; then
            sample "$PID" 3 -file sample.txt >/dev/null 2>&1 || true
            echo "---- main thread ----"
            sed -n '/Call graph:/,$p' sample.txt | head -150 || true
          fi
          xcrun simctl io "$UDID" screenshot screenshot-launch.png || true
          xcrun simctl spawn "$UDID" log show --last 2m --style compact \
            --predicate 'process == "Sandglass" AND messageType >= 16' > app-errors.log || true
          tail -40 app-errors.log
          echo "---- system log mentioning sandglass ----"
          xcrun simctl spawn "$UDID" log show --last 4m --style compact \
            --predicate 'eventMessage CONTAINS[c] "sandglass"' | grep -v "^Timestamp" | tail -60 || true
          cat app-stderr.log 2>/dev/null | tail -20 || true
          wait || true
          cat launch.log
          if xcrun simctl spawn "$UDID" launchctl list | grep -q com.example.sandglass; then
            echo "App is still running after launch"
          else
            echo "::error::The app quit or crashed after launch"
            ls ~/Library/Logs/DiagnosticReports/ || true
            cp ~/Library/Logs/DiagnosticReports/Sandglass* . 2>/dev/null || true
            exit 1
          fi

      - name: Save logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandglass-results
          path: |
            build-*.log
            app-*.log
            sample.txt
            screenshot-*.png
            Sandglass*.ips
          if-no-files-found: ignore

      - name: Publish the screenshots to the ci-screenshots branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp screenshot-*.png /tmp/shots/ 2>/dev/null || exit 0
          cd /tmp/shots
          git init -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
